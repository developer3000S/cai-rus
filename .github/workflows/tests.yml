  # Лёгкие проверки промптов / наслоений (без набора отказов; зеркалит срез GitLab)
  cyber-prompt-smoke:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: fake-for-tests
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      - name: Настройка uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Установка зависимостей
        run: make sync
      - name: Запуск тестов наслоений cyber и загрузки пакетов промптов
        run: uv run pytest tests/util/test_cyber_prompt_layering.py tests/prompts/test_prompt_bundles_load.py -q --timeout=300

  # Тяжелее: полный граф импорта selection_agent (опционально в локальных запусках: pytest -m "not slow")
  selection-agent-smoke:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: fake-for-tests
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      - name: Настройка uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Установка зависимостей
        run: make sync
      - name: Запуск smoke-тестов selection agent
        run: uv run pytest tests/agents/test_selection_agent_smoke.py -q --timeout=600

  build-docs:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: fake-for-tests
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      - name: Настройка uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Установка зависимостей
        run: make sync
      - name: Сборка документации
        run: make build-docs

