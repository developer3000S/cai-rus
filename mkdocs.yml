    - content.code.copy
    # Позволяет выделять блоки кода
    - content.code.select
    # Показывает текущий путь в боковой панели
    - navigation.path
    # Показывает разделы в боковой панели
    - navigation.sections
    # Показывает разделы развёрнутыми по умолчанию
    - navigation.expand
    # Включает аннотации в блоках кода
    - content.code.annotate
