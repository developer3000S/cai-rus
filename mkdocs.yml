plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          selection:
            docstring_style: google
          options:
            # Показывает ссылки на другие элементы в сигнатурах
            signature_crossrefs: true
            # Сортирует элементы по порядку в исходном коде, а не по алфавиту
            members_order: source
            # Размещает сигнатуру на отдельной строке от имени элемента
            separate_signature: true
            # Показывает аннотации типов в сигнатурах
            show_signature_annotations: true
            # Делает размеры шрифтов более приятными
            heading_level: 3
            # Показывает унаследованные элементы
            inherited_members: true

extra:
  # Удаляет сообщение о генерации material в футере
  generator: false

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - admonition
  - codehilite
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

dev_addr: localhost:8088

extra_css:
  - stylesheets/extra.css

watch:
  - "src/cai/sdk/agents"
